name: Build and Archive Docs

on:
  push:
    branches:
      - main  # main 브랜치에 푸시될 때 실행
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y tar

      - name: Build Docs
        run: |
          mkdir -p build
          cp -r sandbox/* build/

      - name: Archive Docs
        run: |
          tar -czvf docs.tgz -C build/*

      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-artifact
          path: docs.tgz
          retention-days: 7  # 7일 동안 유지

      - name: Save Docs as GitHub Release (Optional)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')  # 태그가 있을 때만 실행
        with:
          files: docs.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
